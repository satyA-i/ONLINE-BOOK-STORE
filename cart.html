<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <style>
        table {
            width: 90%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>
<body bgcolor="white" align="center">

    <h2>SHOPPING CART</h2>

    <table align="center">
        <thead>
            <tr>
                <th>Book Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cartItems"></tbody>
    </table>

    <h3 id="grandTotal">Grand Total: ₹0</h3>

    <button onclick="clearCart()">Clear Cart</button>
    <button onclick="checkout()">Place Order</button>

    <p id="message"></p>

    <script>
        function displayCart() {
            let cart = JSON.parse(localStorage.getItem("bookCart")) || [];
            let table = document.getElementById("cartItems");
            let total = 0;

            table.innerHTML = "";

            if (cart.length === 0) {
                table.innerHTML =
                    '<tr><td colspan="5">Your cart is empty</td></tr>';
            }

            cart.forEach((book, index) => {
                let amount = book.price * book.quantity;
                total += amount;

                table.innerHTML += `
                    <tr>
                        <td>${book.name}</td>
                        <td>₹${book.price}</td>
                        <td>
                            <button onclick="changeQuantity(${index},-1)">-</button>
                            ${book.quantity}
                            <button onclick="changeQuantity(${index},1)">+</button>
                        </td>
                        <td>₹${amount}</td>
                        <td><button onclick="removeBook(${index})">Remove</button></td>
                    </tr>
                `;
            });

            document.getElementById("grandTotal").innerHTML =
                "Grand Total: ₹" + total;
        }

        function changeQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem("bookCart")) || [];

            if (!cart[index]) return;

            cart[index].quantity += change;

            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }

            localStorage.setItem("bookCart", JSON.stringify(cart));
            displayCart();
        }

        function removeBook(index) {
            let cart = JSON.parse(localStorage.getItem("bookCart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("bookCart", JSON.stringify(cart));
            displayCart();
        }

        function clearCart() {
            localStorage.removeItem("bookCart");
            displayCart();
            document.getElementById("message").innerHTML = "Cart cleared.";
        }

        function checkout() {
            let cart = JSON.parse(localStorage.getItem("bookCart")) || [];

            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            alert("Order placed successfully! (Demo only)");
            localStorage.removeItem("bookCart");
            displayCart();
        }

        displayCart();
    </script>

    <hr>
    <footer>Satya Prakash | Roll No. 2501920110332</footer>
</body>
</html>
