<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <script src="validation1.html"></script>
</head>
<body bgcolor="white" align="center">

    <h2>REGISTRATION FORM</h2>

    <form onsubmit="return validateRegistration()">
        Name:
        <input type="text" id="name" required>
        <br><br>

        Password:
        <input type="password" id="password" required>
        <br><br>

        E-mail ID:
        <input type="text" id="email" required>
        <br><br>

        Phone Number:
        <input type="text" id="phone" required>
        <br><br>

        Sex:
        <input type="radio" name="sex" value="Male" required> Male
        <input type="radio" name="sex" value="Female"> Female
        <br><br>

        Date of Birth:
        <input type="date" id="dob" required>
        <br><br>

        Languages Known:
        <input type="checkbox" name="language" value="English"> English
        <input type="checkbox" name="language" value="Hindi"> Hindi
        <input type="checkbox" name="language" value="Other"> Other
        <br><br>

        Address:
        <br>
        <textarea id="address" rows="4" cols="30" required></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>

    <hr>
    <footer>Satya Prakash | Roll No. 2501920110332</footer>

    <script>
        function validateRegistration() {
            let name = document.getElementById("name").value.trim();
            let password = document.getElementById("password").value;
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();

            if (!/^[A-Za-z ]+$/.test(name)) {
                alert("Name should contain only letters");
                return false;
            }

            if (password.length < 6) {
                alert("Password must contain at least 6 characters");
                return false;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert("Enter a valid email address");
                return false;
            }

            if (!/^[0-9]{10}$/.test(phone)) {
                alert("Enter a valid 10-digit phone number");
                return false;
            }

            alert("Registration successful (demo)");
            return false;
        }
    </script>
</body>
</html>
