
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | BookNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">BookNest 📚</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main class="page-section">
    <form id="checkout-form" class="form-card">
      <h1>Checkout</h1>

      <label for="customer-name">Full Name</label>
      <input id="customer-name" required placeholder="Enter your full name">

      <label for="email">Email Address</label>
      <input id="email" type="email" required placeholder="Enter email">

      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" required pattern="[0-9]{10}" placeholder="10-digit mobile number">

      <label for="address">Delivery Address</label>
      <textarea id="address" required rows="4" placeholder="Enter your address"></textarea>

      <label for="payment">Payment Method</label>
      <select id="payment" required>
        <option value="">Select payment method</option>
        <option value="cod">Cash on Delivery (Demo)</option>
        <option value="online">Online Payment (Demo Only)</option>
      </select>

      <button type="submit" class="btn">Place Demo Order</button>
      <p class="muted">Demo only: no payment is collected and no order is sent to a server.</p>
    </form>
  </main>

  <footer>
    <p>Satya Prakash | Roll No. 2501920110332</p>
    <p>© 2026 BookNest. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
